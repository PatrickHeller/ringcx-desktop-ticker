<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
<title>RingCX Ticker</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name">RingCX LIVE</span>
      </div>
      <div class="status">
        <span id="conn-state" class="conn-state conn-unknown">verbinde…</span>
        <span id="last-update" class="last-update"></span>
        <button id="settings-btn" class="icon-btn" title="Einstellungen">⚙</button>
        <button id="minimize-btn" class="icon-btn window-control" title="Minimieren" hidden>–</button>
        <button id="close-btn" class="icon-btn window-control" title="Schließen" hidden>✕</button>
      </div>
    </header>

    <div id="error-banner" class="error-banner" hidden></div>

    <main class="ticker-stack">
      <section id="queue-section" class="ticker-row" aria-label="Queue Performance">
        <div class="ticker-label">QUEUES</div>
        <div id="queue-viewport" class="ticker-viewport">
          <div id="queue-track" class="ticker-track"></div>
        </div>
      </section>
      <section id="agent-section" class="ticker-row" aria-label="Agenten">
        <div class="ticker-label">AGENTS</div>
        <div id="agent-viewport" class="ticker-viewport">
          <div id="agent-track" class="ticker-track"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="ticker.js"></script>
</body>
</html>
